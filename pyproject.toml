[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "car_env"
version = "0.1.0"
description = "Standalone 2D car navigation environment, extracted from the T3D project"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
]

[tool.setuptools.packages.find]
include = ["car_env*"]
